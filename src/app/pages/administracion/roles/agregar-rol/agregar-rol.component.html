<vex-page-layout @fadeInRight>
    <vex-page-layout-content [class.container]="layoutCtrl.value === 'boxed'"
        [class.px-6]="layoutCtrl.value === 'fullwidth'">
        <div class="card mt-4">
            <div class="container-fluid p-4">
                <div class="bg-app-bar appbar px-6 h-16 border-b sticky top-0 left-0 flex items-center z-10">
                    <nav class="breadcrumb-simple" aria-label="Ruta de navegación">
                        <a routerLink="/administracion" class="crumb-link">
                            <mat-icon inline>home</mat-icon>
                            Administración
                        </a>
                        <span class="sep">/</span>
                        <span class="crumb-current" aria-current="page">Roles</span>
                        <span class="sep">/</span>
                        <span class="crumb-current" aria-current="page">{{ title }}</span>
                    </nav>
                </div>
                <section class="mt-4">
                    <form [formGroup]="rolForm" class="container-fluid form-skin-lite">
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="section-head">
                                    <h5 class="mb-1">Datos Generales</h5>
                                </div>
                                <div class="section-bar"></div>
                            </div>
                            <div class="col-12 col-md-6 col-lg-6">
                                <label class="form-label">
                                    <i class="fa fa-tag"></i><span>Nombre</span>
                                </label>
                                <mat-form-field appearance="fill" class="w-100">
                                    <input matInput placeholder="Nombre del rol" formControlName="nombre"
                                      (keydown)="bloquearCaracteresEspecialesNombre($event)"
                                      (paste)="onPasteNombre($event)" />
                                    <mat-error *ngIf="rolForm.get('nombre')?.hasError('required')">
                                        El nombre es obligatorio.
                                    </mat-error>
                                    <mat-error *ngIf="rolForm.get('nombre')?.hasError('maxlength')">
                                        El nombre no puede exceder 100 caracteres.
                                    </mat-error>
                                    <mat-error *ngIf="rolForm.get('nombre')?.hasError('pattern')">
                                        El nombre no permite caracteres especiales.
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div class="col-12 col-md-6 col-lg-6">
                                <label class="form-label">
                                    <i class="fa fa-align-left"></i><span>Descripción</span>
                                </label>
                                <mat-form-field appearance="fill" class="w-100">
                                    <input matInput placeholder="Descripción del rol" formControlName="descripcion" />
                                    <mat-error *ngIf="rolForm.get('descripcion')?.hasError('required')">
                                        La descripción es obligatoria.
                                    </mat-error>
                                    <mat-error *ngIf="rolForm.get('descripcion')?.hasError('maxlength')">
                                        La descripción no puede exceder 255 caracteres.
                                    </mat-error>
                                </mat-form-field>
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                                <button mat-raised-button color="primary" type="button"
                                    [disabled]="rolForm.invalid || loading"
                                    (click)="submit()">
                                    <mat-icon>save</mat-icon> Guardar
                                </button>
                                <button mat-raised-button color="warn" type="button" (click)="regresar()">
                                    <mat-icon>close</mat-icon> Cancelar
                                </button>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </div>

    </vex-page-layout-content>
</vex-page-layout>
