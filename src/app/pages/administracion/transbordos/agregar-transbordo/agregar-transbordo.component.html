<vex-page-layout @fadeInRight>
  <vex-page-layout-content [class.container]="layoutCtrl.value === 'boxed'"
      [class.px-6]="layoutCtrl.value === 'fullwidth'">
    <div class="card mt-4">
      <div class="container-fluid p-4">
        <div class="bg-app-bar appbar px-6 h-16 border-b sticky top-0 left-0 flex items-center z-10">
          <nav class="breadcrumb-simple" aria-label="Ruta de navegación">
            <a routerLink="/administracion" class="crumb-link">
              <mat-icon inline>home</mat-icon>
              Administración
            </a>
            <span class="sep">/</span>
            <span class="crumb-current" aria-current="page">Transbordos</span>
            <span class="sep">/</span>
            <span class="crumb-current" aria-current="page">{{title}}</span>
          </nav>
        </div>

        <section class="mt-4">
          <form [formGroup]="transbordoForm" class="container-fluid form-skin-lite">
            <div class="row g-3">
              <div class="col-12">
                <div class="section-head">
                  <h5 class="mb-1">Datos Generales</h5>
                </div>
                <div class="section-bar"></div>
              </div>

              <div class="col-12 col-md-6 col-lg-4">
                <label class="form-label">
                  <i class="fa fa-tag"></i><span>Nombre</span>
                </label>
                <mat-form-field appearance="fill" class="w-100">
                  <input matInput type="text" placeholder="Ej: Transbordo Zona Centro" formControlName="nombre" />
                </mat-form-field>
              </div>

              <div class="col-12 col-md-6 col-lg-4">
                <label class="form-label">
                  <i class="fa fa-clock"></i><span>Tiempo</span>
                </label>
                <mat-form-field appearance="fill" class="w-100">
                  <input matInput type="number" placeholder="Ej: 30" formControlName="tiempo" />
                </mat-form-field>
              </div>

              <div class="col-12 col-md-6 col-lg-4">
                <label class="form-label">
                  <i class="fa fa-user-tie"></i><span>Cliente</span>
                </label>
                <mat-form-field appearance="fill" class="w-100">
                  <mat-select placeholder="Seleccione un cliente" formControlName="idCliente">
                    <mat-option *ngFor="let cliente of listaClientes" [value]="cliente.id">
                      {{ cliente.nombre || cliente.nombreCliente || cliente.razonSocial }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="col-12 col-md-6 col-lg-4">
                <label class="form-label">
                  <i class="fa fa-hashtag"></i><span>Número de Transbordos</span>
                </label>
                <mat-form-field appearance="fill" class="w-100">
                  <input matInput type="number" placeholder="Se calculará automáticamente" formControlName="numeroTransbordos" readonly />
                  <mat-hint>Se calculará automáticamente según los detalles</mat-hint>
                </mat-form-field>
              </div>

              <div class="col-12 col-md-6 col-lg-4">
                <label class="form-label">
                  <i class="fa fa-percent"></i><span>Tipo Descuento</span>
                </label>
                <mat-form-field appearance="fill" class="w-100">
                  <mat-select placeholder="Seleccione tipo descuento" formControlName="idTipoDescuento">
                    <mat-option [value]="null">— Ninguno —</mat-option>
                    <mat-option *ngFor="let tipo of listaTiposDescuento" [value]="tipo.idTipoDescuento || tipo.idCatTipoDescuento || tipo.id">
                      {{ tipo.nombreCatTipoDescuento || tipo.nombre || tipo.nombreTipoDescuento }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <!-- Sección de Detalles -->
              <div class="col-12 mt-4">
                <div class="section-head">
                  <h5 class="mb-1">Detalles</h5>
                </div>
                <div class="section-bar"></div>
              </div>

              <div class="col-12">
                <div formArrayName="detalles">
                  <div *ngFor="let detalle of detallesFormArray.controls; let i = index" [formGroupName]="i" class="mb-3 p-3 border rounded">
                    <div class="row g-3 align-items-end">
                      <div class="col-12 col-md-2">
                        <label class="form-label">
                          <i class="fa fa-sort-numeric-up"></i><span>Número de Transbordo</span>
                        </label>
                        <mat-form-field appearance="fill" class="w-100">
                          <input matInput type="number" formControlName="nroTransbordo" readonly />
                        </mat-form-field>
                      </div>

                      <div class="col-12 col-md-6">
                        <label class="form-label">
                          <i class="fa fa-dollar-sign"></i><span>Costo</span>
                        </label>
                        <mat-form-field appearance="fill" class="w-100">
                          <input matInput type="number" step="0.01" placeholder="Ej: 5.50" formControlName="costo" />
                        </mat-form-field>
                      </div>

                      <div class="col-12 col-md-4 detail-action-button">
                        <button *ngIf="detallesFormArray.length > 1" mat-button color="warn" type="button" 
                          (click)="eliminarDetalle(i)" class="delete-detail-btn">
                          <mat-icon>delete</mat-icon> Eliminar
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="mt-3">
                  <button mat-raised-button color="accent" type="button" (click)="agregarDetalle()">
                    <mat-icon>add</mat-icon> Agregar Detalle
                  </button>
                </div>
              </div>

              <div class="col-12 d-flex justify-content-end gap-2 pt-4">
                <button mat-raised-button color="primary" type="button" (click)="submit()" [disabled]="loading">
                  <mat-icon>save</mat-icon> {{submitButton}}
                </button>
                <button mat-raised-button color="warn" type="button" (click)="regresar()" [disabled]="loading">
                  <mat-icon>close</mat-icon> Cancelar
                </button>
              </div>
            </div>
          </form>
        </section>
      </div>
    </div>

  </vex-page-layout-content>
</vex-page-layout>
