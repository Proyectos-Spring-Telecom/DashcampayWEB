<div class="cambiar-estado-modal">
  <div class="modal-body">
    <div class="icon-container">
      <mat-icon class="question-icon">help_outline</mat-icon>
    </div>
    
    <h3 class="modal-title">Cambiar estado del monedero: {{ data.numeroSerie }}</h3>

    <form [formGroup]="estadoForm" class="estado-form">
      <label class="select-label">Selecciona el tipo de pasajero</label>
      <mat-form-field appearance="fill" class="w-100">
        <mat-select formControlName="idTipoPasajero" placeholder="Seleccione...">
          <mat-option [value]="null">— Seleccione —</mat-option>
          <mat-option *ngFor="let tipo of listaTiposPasajero" [value]="tipo.id">
            {{ tipo.nombre }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </div>

  <div class="modal-actions">
    <button mat-raised-button class="btn-aceptar" (click)="confirmar()" [disabled]="!estadoForm.valid || loading">
      Guardar
    </button>
    <button mat-button class="btn-cancelar" (click)="cancelar()">
      Cancelar
    </button>
  </div>
</div>
