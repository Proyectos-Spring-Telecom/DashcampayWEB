<vex-page-layout @fadeInRight>
  <vex-page-layout-content [class.container]="layoutCtrl.value === 'boxed'"
    [class.px-6]="layoutCtrl.value === 'fullwidth'" class="-mt-6">
    <div class="card mt-4">
      <div class="dashboard-lite p-4">
        <div class="bg-app-bar appbar px-6 h-16 border-b sticky top-0 left-0 flex items-center z-10">
          <nav class="breadcrumb-simple" aria-label="Ruta de navegación">
            <a routerLink="/administracion" class="crumb-link">
              <mat-icon inline>home</mat-icon>
              Administración
            </a>
            <span class="sep">/</span>
            <span class="crumb-current" aria-current="page">Incidentes</span>
          </nav>
          <div class="flex-grow"></div>
          <div class="flex gap-3 actions-bar">
            <button mat-raised-button color="primary" type="button" class="btn-soft textGenerico"
              (click)="toggleExpandGroups()" matTooltip="Expandir / Contraer grupos">
              <mat-icon svgIcon="mat:compare_arrows"></mat-icon>
              <span class="btn-text">{{ autoExpandAllGroups ? 'Contraer' : 'Expandir' }}</span>
            </button>
            <button mat-raised-button color="accent" type="button" class="btn-soft textGenerico"
              (click)="limpiarCampos()" matTooltip="Limpiar filtros">
              <mat-icon svgIcon="mat:restore"></mat-icon>
              <span class="btn-text">Limpiar</span>
            </button>
            <button [appHasPermission]="['119']" (click)="agregarRegistro()" mat-raised-button color="warn" type="button"
              class="btn-soft textGenerico" matTooltip="Agregar">
              <mat-icon>add</mat-icon>
              <span class="btn-text">Agregar</span>
            </button>
          </div>
        </div>
        <section class="mt-5 table-shell">
          <dx-data-grid id="gridContainer" [columnHidingEnabled]="true" [showBorders]="true" [showColumnLines]="true"
            [showRowLines]="true" [rowAlternationEnabled]="true" [dataSource]="listaIncidentes" [keyExpr]="'id'"
            [width]="'100%'" (onOptionChanged)="onGridOptionChanged($event)">
            <dxo-search-panel [visible]="true" [width]="200" placeholder="Buscar..."></dxo-search-panel>
            <dxo-paging [pageSize]="20"></dxo-paging>
            <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20]" [showInfo]="true"></dxo-pager>
            <dxo-group-panel [emptyPanelText]="mensajeAgrupar" [visible]="true"></dxo-group-panel>
            <dxo-filter-row [visible]="showFilterRow"></dxo-filter-row>
            <dxo-header-filter [visible]="showHeaderFilter"></dxo-header-filter>
            <dxo-grouping [autoExpandAll]="autoExpandAllGroups"></dxo-grouping>
            <dxi-column *appHasPermission="['120','121']" caption="Acciones" cellTemplate="Acciones" alignment="center" [width]="250"></dxi-column>
            <dxi-column dataField="imagenVehiculo" caption="Imagen" cellTemplate="imagen" alignment="center" [width]="150"></dxi-column>
            <dxi-column dataField="imagen" caption="Captura" cellTemplate="captura" alignment="center" [width]="150" [allowSorting]="false" [allowFiltering]="false"></dxi-column>
            <dxi-column dataField="nombreEstatus" caption="Estatus Siniestro" alignment="center" cellTemplate="estatusSiniestro" [width]="250"></dxi-column>
            <dxi-column dataField="incidente" caption="Descripción del Incidente" alignment="center" [width]="250"></dxi-column>
            <dxi-column dataField="placaVehiculo" caption="Instalación" alignment="center" [width]="150"></dxi-column>
            <dxi-column dataField="nombreOperador" caption="Operador" alignment="center" [width]="200"></dxi-column>
            <dxi-column dataField="nombreCliente" caption="Cliente" alignment="center" [width]="200"></dxi-column>
            <dxi-column dataField="estatus" caption="Estatus" alignment="center" cellTemplate="estatus" [width]="150"></dxi-column>
            <div *dxTemplate="let row of 'Acciones'" class="d-flex gap-3 justify-content-center">
              <div [appHasPermission]="['120']">
                <button class="btn-edit" (click)="editarRegistro(row.data.id)" matTooltip="Editar">
                  <mat-icon class="btn__icon">edit</mat-icon>
                </button>
              </div>
              <div [appHasPermission]="['121']">
                <button *ngIf="row.data.estatus === 0" class="btn-active" (click)="activar(row.data)"
                  matTooltip="Activar">
                  <mat-icon class="btn__icon">check_circle</mat-icon>
                </button>
                <button *ngIf="row.data.estatus === 1" class="btn-desactive" (click)="desactivar(row.data)"
                  matTooltip="Desactivar">
                  <mat-icon class="btn__icon">block</mat-icon>
                </button>
              </div>
              <div>
                <button class="btn-active" (click)="cambiarEstatusIncidente(row.data)" matTooltip="Cambiar Estado">
                  <mat-icon class="btn__icon">sync</mat-icon>
                </button>
              </div>
            </div>

            <div *dxTemplate="let data of 'imagen'"
              style="display: flex; align-items: center; justify-content: center;">
              <img *ngIf="data.value" style="max-width: 80px; max-height: 80px; border-radius: 4px;"
                [src]="data.value" />
              <img *ngIf="data.value == null" style="max-width: 80px; max-height: 80px; border-radius: 4px;"
                src="https://dashcamsys.s3.us-east-2.amazonaws.com/logos/no-image.jpeg" />
            </div>
            <div *dxTemplate="let f of 'captura'">
              <button class="btn-violet" [disabled]="!f?.data?.imagen"
                (click)="f?.data?.imagen && verCaptura(f.data.imagen)" aria-label="Ver Captura"
                matTooltip="Ver Captura">
                <i class="fa fa-image btn__icon"></i>
              </button>
            </div>
            <div *dxTemplate="let f of 'estatusSiniestro'">
              <span *ngIf="f.data?.idEstatus != null" class="badge-estado-mantenimiento" [ngClass]="{
                  'estado-abierto': f.data.idEstatus === EstadoMantenimientoVehicular.Abierto,
                  'estado-pendiente': f.data.idEstatus === EstadoMantenimientoVehicular.Pendiente,
                  'estado-cerrado': f.data.idEstatus === EstadoMantenimientoVehicular.Cerrado,
                  'estado-cancelado': f.data.idEstatus === EstadoMantenimientoVehicular.Cancelado
                }">
                {{ EstadoMantenimientoVehicularLabels[f.data.idEstatus] || f.data?.nombreEstatus || '—' }}
              </span>
              <span *ngIf="f.data?.idEstatus == null && !f.data?.nombreEstatus && !f.value">—</span>
            </div>
            <div *dxTemplate="let f of 'estatus'">
              <span [ngClass]="f.data.estatus === 1 ? 'badge-status activo' : 'badge-status inactivo'">
                {{ f.data.estatus === 1 ? 'Activo' : 'Inactivo' }}
              </span>
            </div>
          </dx-data-grid>
        </section>
      </div>
    </div>
  </vex-page-layout-content>
</vex-page-layout>
